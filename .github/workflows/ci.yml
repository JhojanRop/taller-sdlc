# CI: red de seguridad para commits que se salten los hooks locales
# (--no-verify o commits desde la UI de GitHub).
# Ejecuta los mismos gates de pre-commit + pytest.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        # instalador oficial de astral (evita dependencias de action marketplace)
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit (all files)
        run: uv run pre-commit run --all-files

      - name: Run tests
        run: uv run pytest
