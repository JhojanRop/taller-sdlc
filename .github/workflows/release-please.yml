# Release Automático (release-please)
# ============================================================
# Genera/actualiza un "Release PR" a partir de Conventional Commits.
# Al hacer merge de ese PR: bump de versión en pyproject.toml,
# actualización de CHANGELOG.md, tag vX.Y.Z y GitHub Release.
#
# Manifest mode v4: configuración en release-please-config.json,
# versión actual en .release-please-manifest.json.

name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release # habilita outputs (releases_created, tag_name, version, ...)
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

