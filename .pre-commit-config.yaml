# Shift-Left: quality gates automáticos antes de cada commit.
# Se evoluciona por etapas: sanitización/calidad -> seguridad -> protección de main -> commitlint.
repos:
  # Sanitización básica del repositorio
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements
      - id: detect-private-key

  # Lint + formato (mismo ruff que ya usa el proyecto)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Seguridad: escaneo de secrets en el diff antes de commitear
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Proteccion de main: los cambios llegan solo via PR desde dev
  - repo: local
    hooks:
      - id: block-commit-on-main
        name: no hacer commit directo en main (trabaja en una rama y abre PR)
        entry: sh -c 'branch="$(git rev-parse --abbrev-ref HEAD 2>/dev/null)"; if [ "$branch" = "main" ]; then echo "\n✋ Commits directos en main no permitidos. Crea una rama desde dev (o feature/) y abre un PR.\n"; exit 1; fi'
        language: system
        always_run: true
        pass_filenames: false
        stages: [pre-commit]
      - id: block-push-to-main
        name: no hacer push directo a main (abre un PR desde dev)
        entry: sh -c 'r="$PRE_COMMIT_REMOTE_BRANCH"; for a in "$@"; do [ "$a" = "refs/heads/main" ] && r="refs/heads/main"; done; if [ "$r" = "refs/heads/main" ]; then echo "\n✋ Push directo a main bloqueado. Sube tu rama y abre un PR a main.\n"; exit 1; fi'
        language: system
        always_run: true
        pass_filenames: true
        stages: [pre-push]

  # Commitlint: Conventional Commits obligatorios en cada mensaje
  - repo: local
    hooks:
      - id: commitlint
        name: commitlint (conventional commits)
        entry: commitlint
        args: [--edit]
        language: node
        additional_dependencies:
          - '@commitlint/cli@21.2.4'
          - '@commitlint/config-conventional@21.2.4'
        stages: [commit-msg]
